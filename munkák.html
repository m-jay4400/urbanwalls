<!-- KÉP NAGYÍTÓ -->

<div class="lightbox" id="lightbox">

    <button class="lightbox-close" id="lightboxClose">&times;</button>

    <img id="lightboxImage" src="" alt="">

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxClose = document.getElementById("lightboxClose");

    const galleryImages = document.querySelectorAll(
        ".gallery-item img"
    );

    galleryImages.forEach(function (image) {

        image.addEventListener("click", function () {

            lightboxImage.src = image.dataset.full || image.src;
lightboxImage.alt = image.alt;

            lightbox.classList.add("active");

        });

    });


    lightboxClose.addEventListener("click", function () {

        lightbox.classList.remove("active");

    });


    lightbox.addEventListener("click", function (event) {

        if (event.target === lightbox) {

            lightbox.classList.remove("active");

        }

    });


    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            lightbox.classList.remove("active");

        }

    });

});

</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const menuOpen = document.getElementById("menuOpen");
    const menuClose = document.getElementById("menuClose");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuOverlay = document.getElementById("menuOverlay");

    const servicesToggle = document.getElementById("servicesToggle");
    const servicesSubmenu = document.getElementById("servicesSubmenu");

    menuOpen.onclick = function () {
        mobileMenu.classList.add("active");
        menuOverlay.classList.add("active");
    };

    menuClose.onclick = function () {
        mobileMenu.classList.remove("active");
        menuOverlay.classList.remove("active");
    };

    menuOverlay.onclick = function () {
        mobileMenu.classList.remove("active");
        menuOverlay.classList.remove("active");
    };

    if (servicesToggle && servicesSubmenu) {
        servicesToggle.onclick = function () {
            servicesSubmenu.classList.toggle("active");

            const sign = servicesToggle.querySelector("span");

            if (sign) {
                sign.textContent =
                    servicesSubmenu.classList.contains("active") ? "−" : "+";
            }
        };
    }

});
</script>
